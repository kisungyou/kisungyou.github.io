name: Deploy website with pySHT documentation

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "tools/check_pages_site.py"
      - "tools/prepare_pages_site.py"
  schedule:
    # Pick up documentation changes from pySHT without a cross-repository token.
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  build:
    name: Build combined website
    if: >-
      github.repository == 'kisungyou/kisungyou.github.io' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the personal website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pySHT
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kisungyou/pySHT
          ref: master
          path: _pysht
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _pysht/pyproject.toml

      - name: Install pySHT and its documentation dependencies
        run: python -m pip install "./_pysht[docs]"

      - name: Stage the existing personal website
        run: python tools/prepare_pages_site.py docs pages-site

      - name: Build pySHT at the lowercase documentation path
        run: >-
          python -m sphinx -E -a -W --keep-going -b html
          _pysht/docs pages-site/pysht

      - name: Verify the combined website
        run: python tools/check_pages_site.py docs pages-site

      - name: Record the deployed pySHT revision
        run: |
          echo "pySHT commit: $(git -C _pysht rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Documentation path: /pysht/" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the combined Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-site
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
